name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # 🚨 核心修改：Capacitor 8 需要 Java 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Capacitor and Build APK
        run: |
          cd frontend
          npx cap sync android
          cd android
          chmod +x gradlew
          # 强制 Gradle 使用环境中的 Java 21
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BadloVoice-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
